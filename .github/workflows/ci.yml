name: CI

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: "17 5 * * 1"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7

            - uses: DeterminateSystems/nix-installer-action@v23

            - name: Refresh flake.lock
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || hashFiles('flake.lock') == ''
              run: nix flake update

            - name: Build
              run: nix build .#skriuw --print-build-logs

            - name: No unresolved libraries
              run: |
                  if ldd result/bin/.skriuw-app-wrapped 2>/dev/null | grep -q 'not found'; then
                    ldd result/bin/.skriuw-app-wrapped | grep 'not found'
                    exit 1
                  fi

            - name: Flake check
              run: nix flake check --no-build

            - name: Commit flake.lock
              if: github.event_name != 'pull_request'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add flake.lock
                  if git diff --cached --quiet; then
                    echo "flake.lock unchanged."
                  else
                    git commit -m "flake.lock: refresh"
                    git push
                  fi
